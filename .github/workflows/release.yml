name: Release

on:
  release:
    types: [published]

# 说明：GitHub 自 2025 年起发布资产不可变（已发布的 Release 不能再上传资产），
# 仓库的 tag 保护规则又限制 git/API 直接建 tag（tag 只能随 Release 创建），
# 因此本流水线只做发布后校验；ZIP 资产不再提供，手动安装可用
# Release 页自带的 "Source code (zip)"（HACS 安装不受影响）。

jobs:
  validate:
    name: "发布后验证"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 验证版本号一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VER="${TAG#v}"
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('custom_components/zhangjiajie_water/manifest.json'))['version'])")
          # const.py 自 v3.1.0 起从 manifest.json 读取版本（无字面量），改为直接 import
          # （const.py 仅依赖标准库，可脱离 HA 独立导入）
          CONST_VER=$(python3 -c "import sys; sys.path.insert(0, 'custom_components/zhangjiajie_water'); from const import INTEGRATION_VERSION; print(INTEGRATION_VERSION)")
          echo "Tag: $TAG_VER | Manifest: $MANIFEST_VER | Const: $CONST_VER"
          if [ "$TAG_VER" != "$MANIFEST_VER" ]; then
            echo "ERROR: Tag version ($TAG_VER) != manifest.json version ($MANIFEST_VER)"
            exit 1
          fi
          if [ "$TAG_VER" != "$CONST_VER" ]; then
            echo "ERROR: Tag version ($TAG_VER) != const.py version ($CONST_VER)"
            exit 1
          fi
          echo "All versions match: $TAG_VER"

      - name: HACS 验证
        uses: hacs/action@main
        with:
          CATEGORY: "integration"

      - name: Hassfest 验证
        uses: home-assistant/actions/hassfest@master
