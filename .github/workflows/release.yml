name: Release

on:
  push:
    tags: ["v*"]

jobs:
  validate:
    name: "发布前验证"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 验证版本号一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VER="${TAG#v}"
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('custom_components/zhangjiajie_water/manifest.json'))['version'])")
          # const.py 自 v3.1.0 起从 manifest.json 读取版本（无字面量），改为直接 import
          # （const.py 仅依赖标准库，可脱离 HA 独立导入）
          CONST_VER=$(python3 -c "import sys; sys.path.insert(0, 'custom_components/zhangjiajie_water'); from const import INTEGRATION_VERSION; print(INTEGRATION_VERSION)")
          echo "Tag: $TAG_VER | Manifest: $MANIFEST_VER | Const: $CONST_VER"
          if [ "$TAG_VER" != "$MANIFEST_VER" ]; then
            echo "ERROR: Tag version ($TAG_VER) != manifest.json version ($MANIFEST_VER)"
            exit 1
          fi
          if [ "$TAG_VER" != "$CONST_VER" ]; then
            echo "ERROR: Tag version ($TAG_VER) != const.py version ($CONST_VER)"
            exit 1
          fi
          echo "All versions match: $TAG_VER"

      - name: HACS 验证
        uses: hacs/action@main
        with:
          CATEGORY: "integration"

      - name: Hassfest 验证
        uses: home-assistant/actions/hassfest@master

  attach-zip:
    name: "创建 Release 并上传 ZIP"
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 打包 ZIP
        run: |
          cd custom_components/zhangjiajie_water
          # ../../ 回到仓库根（workspace），zip 必须落在 workspace 内才能上传
          zip -r ../../zhangjiajie_water.zip ./

      # GitHub 发布资产不可变：已发布的 Release 不允许再上传资产，
      # 必须先建草稿 → 上传 ZIP → 再发布
      - name: 草稿创建 Release 并上传 ZIP 后发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --draft \
            --title "$TAG" \
            --notes "更新日志见 README: https://github.com/yahooor/zhangjiajie_water_ha#更新日志"
          gh release upload "$TAG" zhangjiajie_water.zip
          gh release edit "$TAG" --draft=false
          echo "Release published with assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
